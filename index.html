<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senzy Hub - Premium Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Plus Jakarta Sans', sans-serif; } 
        .glow-box { box-shadow: 0 0 40px -10px rgba(99, 102, 241, 0.15); }
    </style>
</head>
<body class="bg-[#090a0f] text-slate-100 min-h-screen p-6 md:p-10">
    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
            <div>
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold mb-3">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> LIVE SYSTEM
                </div>
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white">Senzy Hub <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">Dashboard</span></h1>
                <p class="text-slate-400 text-sm mt-1">Real-time script execution tracking, user rankings, and popular games.</p>
            </div>
            
            <div class="bg-slate-900/80 border border-slate-800/80 backdrop-blur-xl px-6 py-4 rounded-3xl glow-box flex items-center gap-5 w-full md:w-auto">
                <div class="p-3 bg-indigo-600/10 rounded-2xl border border-indigo-500/20 text-indigo-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <div>
                    <span class="block text-xs text-slate-400 uppercase tracking-wider font-bold">Total Executes</span>
                    <span id="total-executes" class="text-3xl font-black text-white">Loading...</span>
                </div>
            </div>
        </div>

        <!-- Top Ranking -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Top Users -->
            <div class="bg-slate-900/60 border border-slate-800/80 backdrop-blur-xl rounded-3xl p-6 shadow-xl">
                <h2 class="font-bold text-lg text-white mb-4 flex items-center gap-2">👑 Top Users</h2>
                <div id="top-users-list" class="space-y-3">
                    <div class="text-sm text-slate-500 text-center py-4">Loading data...</div>
                </div>
            </div>

            <!-- Top Games -->
            <div class="bg-slate-900/60 border border-slate-800/80 backdrop-blur-xl rounded-3xl p-6 shadow-xl">
                <h2 class="font-bold text-lg text-white mb-4 flex items-center gap-2">🎮 Top Games</h2>
                <div id="top-games-list" class="space-y-3">
                    <div class="text-sm text-slate-500 text-center py-4">Loading data...</div>
                </div>
            </div>
        </div>

        <!-- Live Stream Logs -->
        <div class="bg-slate-900/60 border border-slate-800/80 backdrop-blur-xl rounded-3xl overflow-hidden shadow-2xl">
            <div class="px-6 py-5 border-b border-slate-800/80 flex justify-between items-center">
                <h2 class="font-bold text-lg text-slate-200">Recent Execution Stream</h2>
                <div class="flex items-center gap-2 text-xs text-slate-400">
                    <span class="flex h-2.5 w-2.5 relative">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                    Auto-refresh
                </div>
            </div>
            <div id="log-list" class="divide-y divide-slate-800/50">
                <div class="px-6 py-8 text-center text-slate-500">Syncing data...</div>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = "https://lpbvuczqsskfwsuepsfp.supabase.co";
        const SUPABASE_KEY = "sb_publishable_RdMZICadjdwbZzZv-cS8Yw_cVuf4PCH";

        async function fetchDashboardData() {
            try {
                const statsRes = await fetch(`${SUPABASE_URL}/rest/v1/hub_stats?id=eq.total_executes&select=count`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                const statsData = await statsRes.json();
                if (statsData && statsData.length > 0) {
                    document.getElementById('total-executes').innerText = statsData[0].count.toLocaleString();
                }

                const logsRes = await fetch(`${SUPABASE_URL}/rest/v1/hub_logs?select=*&order=created_at.desc&limit=200`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                const logs = await logsRes.json();

                if (!logs || logs.length === 0) return;

                // Top Users
                const userCounts = {};
                logs.forEach(log => {
                    if (!userCounts[log.username]) {
                        userCounts[log.username] = { count: 0, userid: log.userid, avatar: log.avatarurl };
                    }
                    userCounts[log.username].count++;
                });
                const sortedUsers = Object.entries(userCounts).sort((a, b) => b[1].count - a[1].count).slice(0, 5);

                document.getElementById('top-users-list').innerHTML = sortedUsers.map(([username, data], index) => `
                    <div class="flex items-center justify-between p-3 rounded-2xl bg-slate-800/40 border border-slate-700/50">
                        <div class="flex items-center gap-3">
                            <span class="font-extrabold text-xs text-indigo-400 w-4">#${index + 1}</span>
                            <img src="${data.avatar || 'https://tr.rbxcdn.com/3513dc3b91a7cbb02e0b571169aa354f/150/150/Image/Png'}" class="w-10 h-10 rounded-xl object-cover bg-slate-800 border border-slate-700">
                            <div>
                                <a href="https://www.roblox.com/users/${data.userid}/profile" target="_blank" class="font-bold text-white text-sm hover:text-indigo-400 transition">${username}</a>
                                <div class="text-[11px] text-slate-400">ID: ${data.userid}</div>
                            </div>
                        </div>
                        <span class="px-3 py-1 bg-indigo-500/10 text-indigo-400 text-xs font-bold rounded-xl border border-indigo-500/20">${data.count} runs</span>
                    </div>
                `).join('');

                // Top Games (กรองเอาเฉพาะแมพที่ไม่ใช่ Unsupported Game ออกจากการนับอันดับ จะได้ดูสมจริง)
                const gameMap = {};
                logs.forEach(log => {
                    const map = log.mapname || "Unknown Map";
                    if (map === "Unsupported Game") return; // ข้ามแมพที่ไม่รองรับ
                    if (!gameMap[map]) {
                        gameMap[map] = { count: 0, thumb: log.mapthumbnail, placeid: log.placeid };
                    }
                    gameMap[map].count++;
                });
                const sortedGames = Object.entries(gameMap).sort((a, b) => b[1].count - a[1].count).slice(0, 5);

                if (sortedGames.length === 0) {
                    document.getElementById('top-games-list').innerHTML = '<div class="text-sm text-slate-500 text-center py-4">No supported games played yet</div>';
                } else {
                    document.getElementById('top-games-list').innerHTML = sortedGames.map(([mapname, data], index) => `
                        <div class="flex items-center justify-between p-3 rounded-2xl bg-slate-800/40 border border-slate-700/50">
                            <div class="flex items-center gap-3">
                                <span class="font-extrabold text-xs text-purple-400 w-4">#${index + 1}</span>
                                <img src="${data.thumb || 'https://tr.rbxcdn.com/3513dc3b91a7cbb02e0b571169aa354f/150/150/Image/Png'}" class="w-10 h-10 rounded-xl object-cover bg-slate-800 border border-slate-700">
                                <div>
                                    <div class="font-bold text-white text-sm truncate max-w-[160px]">${mapname}</div>
                                    <div class="text-[11px] text-slate-400">PlaceID: ${data.placeid}</div>
                                </div>
                            </div>
                            <span class="px-3 py-1 bg-purple-500/10 text-purple-400 text-xs font-bold rounded-xl border border-purple-500/20">${data.count} runs</span>
                        </div>
                    `).join('');
                }

                // Live Stream Logs
                document.getElementById('log-list').innerHTML = logs.slice(0, 15).map(log => `
                    <div class="px-6 py-4 flex items-center justify-between hover:bg-slate-800/30 transition">
                        <div class="flex items-center space-x-4">
                            <img src="${log.avatarurl || 'https://tr.rbxcdn.com/3513dc3b91a7cbb02e0b571169aa354f/150/150/Image/Png'}" class="w-12 h-12 rounded-2xl bg-slate-800 border border-slate-700 object-cover">
                            <div>
                                <div class="font-bold text-white flex items-center gap-2">
                                    <a href="https://www.roblox.com/users/${log.userid}/profile" target="_blank" class="hover:text-indigo-400 transition">${log.username}</a>
                                    <span class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">ID: ${log.userid}</span>
                                </div>
                                <div class="text-xs text-indigo-400 font-medium mt-1 flex items-center gap-2">
                                    <img src="${log.mapthumbnail || ''}" class="w-4 h-4 rounded object-cover"> 🎮 ${log.mapname}
                                </div>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="inline-flex items-center px-2.5 py-1 bg-emerald-500/10 text-emerald-400 text-xs font-semibold rounded-xl border border-emerald-500/20">Success</span>
                            <div class="text-[11px] text-slate-500 mt-1">${new Date(log.created_at).toLocaleTimeString('th-TH')}</div>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                console.error("Error loading dashboard:", err);
            }
        }

        fetchDashboardData();
        setInterval(fetchDashboardData, 4000);
    </script>
</body>
</html>
