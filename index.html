<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senzy Hub - Premium Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Plus Jakarta Sans', sans-serif; } 
        .glow-box { box-shadow: 0 0 40px -10px rgba(99, 102, 241, 0.15); }
    </style>
</head>
<body class="bg-[#090a0f] text-slate-100 min-h-screen p-6 md:p-12">
    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-6 mb-10">
            <div>
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold mb-3">
                    <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span> SYSTEM ONLINE
                </div>
                <h1 class="text-4xl font-extrabold tracking-tight text-white">Senzy Hub <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">Analytics</span></h1>
                <p class="text-slate-400 text-sm mt-1">ระบบติดตามสถิติการใช้งานสคริปต์และข้อมูลผู้เล่นเรียลไทม์</p>
            </div>
            <!-- Total Executes Card -->
            <div class="bg-slate-900/80 border border-slate-800/80 backdrop-blur-xl px-6 py-4 rounded-3xl glow-box flex items-center gap-5 w-full md:w-auto">
                <div class="p-3 bg-indigo-600/10 rounded-2xl border border-indigo-500/20 text-indigo-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <div>
                    <span class="block text-xs text-slate-400 uppercase tracking-wider font-bold">Total Executes</span>
                    <span id="total-executes" class="text-3xl font-black text-white">Loading...</span>
                </div>
            </div>
        </div>

        <!-- Logs Container -->
        <div class="bg-slate-900/60 border border-slate-800/80 backdrop-blur-xl rounded-3xl overflow-hidden shadow-2xl">
            <div class="px-6 py-5 border-b border-slate-800/80 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <h2 class="font-bold text-lg text-slate-200">Live Execution Stream</h2>
                    <span class="px-2.5 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold">Real-time</span>
                </div>
                <div class="flex items-center gap-2 text-xs text-slate-400">
                    <span class="flex h-2.5 w-2.5 relative">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                    Auto-refresh
                </div>
            </div>

            <!-- List of Users -->
            <div id="log-list" class="divide-y divide-slate-800/50">
                <div class="px-6 py-12 text-center text-slate-500">กำลังซิงค์ข้อมูลผู้ใช้งาน...</div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lpbvuczqsskfwsuepsfp.supabase.co";
        const SUPABASE_KEY = "sb_publishable_RdMZICadjdwbZzZv-cS8Yw_cVuf4PCH";

        async function fetchData() {
            try {
                // 1. ดึงยอดรวมจาก hub_stats
                const statsRes = await fetch(`${SUPABASE_URL}/rest/v1/hub_stats?id=eq.total_executes&select=count`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                const statsData = await statsRes.json();
                if (statsData && statsData.length > 0) {
                    document.getElementById('total-executes').innerText = statsData[0].count.toLocaleString();
                }

                // 2. ดึงข้อมูล Log ผู้เล่นล่าสุดจาก hub_logs
                const logsRes = await fetch(`${SUPABASE_URL}/rest/v1/hub_logs?select=*&order=created_at.desc&limit=30`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                const logs = await logsRes.json();
                
                const listEl = document.getElementById('log-list');
                if (!logs || logs.length === 0) {
                    listEl.innerHTML = '<div class="px-6 py-12 text-center text-slate-500">ยังไม่มีประวัติการรันในระบบ (ต้องสร้างตาราง hub_logs และให้สคริปต์ส่งข้อมูลเข้ามาเพิ่ม)</div>';
                    return;
                }

                listEl.innerHTML = logs.map(log => `
                    <div class="px-6 py-4 flex items-center justify-between hover:bg-slate-800/30 transition duration-200">
                        <div class="flex items-center space-x-4">
                            <div class="relative">
                                <img src="${log.avatarurl || 'https://tr.rbxcdn.com/3513dc3b91a7cbb02e0b571169aa354f/150/150/Image/Png'}" alt="Avatar" class="w-12 h-12 rounded-2xl bg-slate-800 border border-slate-700 object-cover">
                                <span class="absolute -bottom-1 -right-1 w-4 h-4 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
                            </div>
                            <div>
                                <div class="font-bold text-white flex items-center gap-2">
                                    <a href="https://www.roblox.com/users/${log.userid}/profile" target="_blank" class="hover:text-indigo-400 transition flex items-center gap-1">
                                        ${log.username}
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                                    </a>
                                    <span class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">ID: ${log.userid}</span>
                                </div>
                                <div class="text-xs text-indigo-400 font-medium mt-1 flex items-center gap-1.5">
                                    🎮 แมพ: <span class="text-slate-300">${log.mapname}</span> 
                                    <span class="text-slate-600">|</span> 
                                    <span class="text-slate-500 text-[11px]">PlaceID: ${log.placeid}</span>
                                </div>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="inline-flex items-center px-2.5 py-1 bg-emerald-500/10 text-emerald-400 text-xs font-semibold rounded-xl border border-emerald-500/20">
                                Success
                            </span>
                            <div class="text-[11px] text-slate-500 mt-1">${new Date(log.created_at).toLocaleTimeString('th-TH')} - ${new Date(log.created_at).toLocaleDateString('th-TH')}</div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Error loading dashboard data:", err);
            }
        }

        fetchData();
        setInterval(fetchData, 4000); // อัปเดตข้อมูลอัตโนมัติทุกๆ 4 วินาที
    </script>
</body>
</html>
